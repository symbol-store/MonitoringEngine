<!DOCTYPE html>
<meta charset="utf-8">
<style>
  #reject-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); }
  #reject-overlay[hidden] { display: none; }
  #reject-dialog { display: flex; flex-direction: column; gap: 0.5rem; min-width: 22rem; padding: 1rem; background: #fff; border-radius: 6px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); }
  #reject-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
  .cm-tooltip:has(.synopsis-tooltip) { max-width: none; background: #fff; border: 1px solid #cfcfcf; border-radius: 4px; }
  .synopsis-tooltip { padding: 4px 6px; }

<script type="importmap">
{
  "imports": {
    "@codemirror/state": "https://esm.sh/*@codemirror/state@6.7.1",
    "@codemirror/view": "https://esm.sh/*@codemirror/view@6.43.6",
    "@codemirror/language": "https://esm.sh/*@codemirror/language@6.12.4",
    "@codemirror/legacy-modes/": "https://esm.sh/*@codemirror/legacy-modes@6.5.3/",
    "@lezer/common": "https://esm.sh/*@lezer/common@1.5.2",
    "@lezer/highlight": "https://esm.sh/*@lezer/highlight@1.2.3",
    "@lezer/lr": "https://esm.sh/*@lezer/lr@1.4.10",
    "@marijn/find-cluster-break": "https://esm.sh/@marijn/find-cluster-break@1.0.3",
    "style-mod": "https://esm.sh/style-mod@4.1.3",
    "w3c-keyname": "https://esm.sh/w3c-keyname@2.2.8",
    "crelt": "https://esm.sh/crelt@1.0.7"
  }
}
</script>
<script type="module">
import { EditorView, hoverTooltip } from "@codemirror/view";
import { EditorState } from "@codemirror/state";
import { StreamLanguage, foldGutter, foldService, codeFolding, foldEffect, foldedRanges, syntaxHighlighting, defaultHighlightStyle } from "@codemirror/language";
import { commonLisp } from "@codemirror/legacy-modes/mode/commonlisp";

const lispFold = foldService.of((state, lineStart, lineEnd) => {
  const s = state.doc.toString();
  let open = -1;
  for (let i = lineStart; i < lineEnd; i++) {
    if (s[i] === "(") { open = i; break; }
    if (s[i] === ";" || s[i] === '"') break;
  }
  if (open === -1) return null;

  let depth = 0, inString = false;
  for (let i = open; i < s.length; i++) {
    const ch = s[i];
    if (inString) {
      if (ch === "\\") i++;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') inString = true;
    else if (ch === ";") { while (i < s.length && s[i] !== "\n") i++; }
    else if (ch === "(") depth++;
    else if (ch === ")") {
      if (--depth === 0) {
        return i > lineEnd ? { from: lineEnd, to: i + 1 } : null;
      }
    }
  }
  return null;
});

function makeEditor(parent, extra = []) {
  return new EditorView({
    state: EditorState.create({
      doc: "",
      extensions: [
        foldGutter({ openText: "▾", closedText: "▸" }),
        codeFolding(),
        StreamLanguage.define(commonLisp),
        syntaxHighlighting(defaultHighlightStyle),
        lispFold,
        EditorState.readOnly.of(true),
        EditorView.editable.of(false),
        ...extra,
      ],
    }),
    parent,
  });
}

const synopsisHover = hoverTooltip((view, pos) => {
  const text = view.state.doc.toString();
  let cols, spans;
  try { cols = synopsisColumns(parseSexpr(text)); spans = columnNameSpans(text); }
  catch (e) { return null; }
  if (!cols || !spans.length) return null;
  for (let idx = 0; idx < spans.length && idx < cols.length; idx++) {
    const s = spans[idx];
    if (pos >= s.from && pos <= s.to) {
      return {
        pos: s.from, end: s.to, above: true,
        create() {
          const dom = document.createElement('div');
          dom.className = 'synopsis-tooltip';
          renderSynopsis([cols[idx]], dom, { width: 620, height: 300 });
          return { dom };
        },
      };
    }
  }
  return null;
});

const queryView = makeEditor(document.getElementById("query"), [synopsisHover]);

// Position-aware parse (character offsets), shared by folding and the radial menu.
function parsePos(text) {
  const n = text.length;
  let i = 0;
  const isSpace = (k) => { const c = text.charCodeAt(k); return c === 32 || (c >= 9 && c <= 13); };
  const skip = () => { while (i < n && isSpace(i)) i++; };
  function node() {
    skip();
    if (i >= n) return null;
    if (text[i] === '(') {
      const from = i; i++;
      skip();
      let headFrom = -1, headTo = -1, head = null;
      if (i < n && text[i] !== '(' && text[i] !== ')') {
        headFrom = i;
        while (i < n && !isSpace(i) && text[i] !== '(' && text[i] !== ')') i++;
        headTo = i; head = text.slice(headFrom, headTo);
      }
      const children = [];
      for (;;) {
        skip();
        if (i >= n || text[i] === ')') { if (i < n) i++; break; }
        const c = node();
        if (!c) break;
        children.push(c);
      }
      return { from, to: i, headFrom, headTo, head, children };
    }
    if (text[i] === ')') return null;
    const from = i;
    while (i < n && !isSpace(i) && text[i] !== '(' && text[i] !== ')') i++;
    return { from, to: i, atom: true, children: [] };
  }
  return node();
}

// The list whose HEAD token covers `offset`, plus the head names enclosing it.
function locate(tree, offset) {
  let found = null;
  (function walk(node, ancestors) {
    if (!node || node.atom) return;
    if (node.headFrom >= 0 && offset >= node.headFrom && offset <= node.headTo)
      found = { node, ancestors: ancestors.slice() };
    for (const c of node.children) walk(c, ancestors.concat(node));
  })(tree, []);
  if (!found) return null;
  const heads = [found.node.head].concat(found.ancestors.map((a) => a.head)).filter(Boolean);
  return { node: found.node, heads };
}

// Fold range for a list node: from its first newline to just past its close paren.
function foldRangeOfNode(text, node) {
  if (!node || node.atom) return null;
  let nl = -1;
  for (let k = node.from; k < node.to; k++) if (text.charCodeAt(k) === 10) { nl = k; break; }
  return nl >= 0 ? { from: nl, to: node.to } : null;
}

// Multi-line, non-root lists with more than five arguments (the root is never folded).
function foldRanges(text) {
  const ranges = [];
  (function walk(node, isRoot) {
    if (!node || node.atom) return;
    if (!isRoot && node.children.length > 5) {
      const r = foldRangeOfNode(text, node);
      if (r) ranges.push(r);
    }
    node.children.forEach((c) => walk(c, false));
  })(parsePos(text), true);
  return ranges;
}

// Tree-path helpers, used to preserve fold status across a wrap.
const samePath = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const startsWithPath = (q, p) => q.length > p.length && p.every((v, i) => v === q[i]);
function nodeAtPath(tree, path) {
  let n = tree;
  for (const k of path) { if (!n || !n.children || !n.children[k]) return null; n = n.children[k]; }
  return n;
}
function pathOfNode(tree, from, to) {
  let res = null;
  (function walk(node, path) {
    if (!node || res) return;
    if (!node.atom && node.from === from && node.to === to) { res = path; return; }
    if (node.children) node.children.forEach((c, k) => walk(c, path.concat(k)));
  })(tree, []);
  return res;
}
function foldedPaths(tree, foldedTos) {
  const paths = [];
  (function walk(node, path) {
    if (!node || node.atom) return;
    if (foldedTos.has(node.to)) paths.push(path);
    node.children.forEach((c, k) => walk(c, path.concat(k)));
  })(tree, []);
  return paths;
}
function currentFoldedTos(view) {
  const tos = new Set();
  const it = foldedRanges(view.state).iter();
  while (it.value !== null) { tos.add(it.to); it.next(); }
  return tos;
}

function applyAutoFold(view) {
  const ranges = foldRanges(view.state.doc.toString());
  if (ranges.length) view.dispatch({ effects: ranges.map((r) => foldEffect.of(r)) });
}

// --- Radial action menu: drag an expression head to wrap that expression ---
// One wedge per action, splitting the circle evenly; the first wedge's centre
// line faces North, the rest follow clockwise.
function attachRadialMenu(view) {
  const ACTIONS = ['Hide', 'Synopsize'];
  const N = ACTIONS.length, SLICE = 360 / N;
  const OUTER = 84, INNER = 22;
  const NS = 'http://www.w3.org/2000/svg';
  const centerDeg = (i) => -90 + i * SLICE;   // -90 deg = North (screen angle, y down)

  function wedgePath(cx, cy, r0, r1, a0, a1) {
    const rad = (a) => a * Math.PI / 180;
    const px = (r, a) => cx + r * Math.cos(rad(a));
    const py = (r, a) => cy + r * Math.sin(rad(a));
    const large = (a1 - a0) > 180 ? 1 : 0;
    return 'M ' + px(r1, a0) + ' ' + py(r1, a0) +
      ' A ' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + px(r1, a1) + ' ' + py(r1, a1) +
      ' L ' + px(r0, a1) + ' ' + py(r0, a1) +
      ' A ' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + px(r0, a0) + ' ' + py(r0, a0) + ' Z';
  }

  function buildMenu(cx, cy, disabled) {
    const size = OUTER * 2;
    const wrap = document.createElement('div');
    wrap.className = 'radial-menu';
    wrap.style.left = (cx - OUTER) + 'px';
    wrap.style.top = (cy - OUTER) + 'px';
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', size); svg.setAttribute('height', size);
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    const wedges = [], labels = [], actionable = [];
    for (let i = 0; i < N; i++) {
      const action = ACTIONS[i];
      const off = disabled.has(action);
      actionable[i] = !off;
      const center = centerDeg(i);
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', wedgePath(OUTER, OUTER, INNER, OUTER, center - SLICE / 2, center + SLICE / 2));
      path.setAttribute('class', 'wedge' + (off ? ' disabled' : ' populated'));
      svg.appendChild(path); wedges.push(path);
      const r = (INNER + OUTER) / 2, ang = center * Math.PI / 180;
      const label = document.createElementNS(NS, 'text');
      label.setAttribute('x', OUTER + r * Math.cos(ang));
      label.setAttribute('y', OUTER + r * Math.sin(ang));
      label.textContent = action;
      if (off) label.setAttribute('class', 'disabled');
      svg.appendChild(label); labels[i] = label;
    }
    wrap.appendChild(svg);
    document.body.appendChild(wrap);
    return {
      setActive(idx) {
        for (let i = 0; i < N; i++) {
          const on = i === idx && actionable[i];
          wedges[i].classList.toggle('active', on);
          labels[i].classList.toggle('active', on);
        }
      },
      actionAt(idx) { return actionable[idx] ? ACTIONS[idx] : null; },
      destroy() { wrap.remove(); },
    };
  }

  function applyWrap(action, node) {
    if (!boss) return;
    const oldText = view.state.doc.toString();
    const wrapped = boss.wrap(oldText.slice(node.from, node.to), action);
    if (wrapped.isError) { console.warn('wrap failed:', wrapped.text); return; }
    // Capture fold status (by tree path) before the reprint shifts every position.
    const oldTree = parsePos(oldText);
    const target = pathOfNode(oldTree, node.from, node.to);
    const oldFolded = foldedPaths(oldTree, currentFoldedTos(view));
    view.dispatch({ changes: { from: node.from, to: node.to, insert: wrapped.text.trimEnd() } });
    if (!target) return;
    // The new wrapper is always unfolded; the wrapped expression (now one level
    // deeper) and every other node keep their prior fold status.
    const newText = view.state.doc.toString(), newTree = parsePos(newText);
    const add = [];
    for (const q of oldFolded) {
      if (samePath(q, target)) add.push(target.concat(0));
      else if (startsWithPath(q, target)) add.push(target.concat(0).concat(q.slice(target.length)));
    }
    const ranges = add.filter((p) => p.length > 0)
      .map((p) => foldRangeOfNode(newText, nodeAtPath(newTree, p)))
      .filter(Boolean);
    if (ranges.length) view.dispatch({ effects: ranges.map((r) => foldEffect.of(r)) });
  }

  view.contentDOM.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const pos = view.posAtCoords({ x: e.clientX, y: e.clientY });
    if (pos == null) return;
    const hit = locate(parsePos(view.state.doc.toString()), pos);
    if (!hit) return;
    e.preventDefault();
    const node = hit.node;
    const disabled = new Set(ACTIONS.filter((a) => hit.heads.includes(a)));
    const c1 = view.coordsAtPos(node.headFrom), c2 = view.coordsAtPos(node.headTo);
    const cx = (c1.left + c2.right) / 2, cy = (c1.top + c2.bottom) / 2;
    const menu = buildMenu(cx, cy, disabled);
    let activeDir = -1;
    const onMove = (ev) => {
      const dx = ev.clientX - cx, dy = ev.clientY - cy;
      if (Math.hypot(dx, dy) < INNER) { activeDir = -1; menu.setActive(-1); return; }
      const phi = ((Math.atan2(dy, dx) * 180 / Math.PI + 90) % 360 + 360) % 360;
      activeDir = Math.round(phi / SLICE) % N;
      menu.setActive(activeDir);
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      const action = activeDir >= 0 ? menu.actionAt(activeDir) : null;
      menu.destroy();
      if (action) applyWrap(action, node);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });
}
attachRadialMenu(queryView);

let boss = null;
createBOSS({}).then((m) => { boss = m; }).catch((e) => { console.error("BOSS module failed to load:", e); });

function setDoc(view, text) {
  view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text } });
}

// --- Synopsis visualization (Observable Plot) ----------------------------
// A report shaped (Table (col cell...)) whose cells are numbers (raw
// samples), NULL (gaps), or (RunOfLengthWithProperties N (First f)(Slope s)
// (MaxResidual r)...) (compressed runs) is drawn as a time series: raw
// samples as dots, each run as its linear trend inside a +/-MaxResidual band.
function parseSexpr(text) {
  let i = 0;
  const n = text.length;
  const isSpace = (k) => { const cc = text.charCodeAt(k); return cc === 32 || (cc >= 9 && cc <= 13); };
  const isDelim = (k) => { const c = text[k]; return c === '(' || c === ')' || isSpace(k); };
  function node() {
    while (i < n && isSpace(i)) i++;
    if (i >= n) throw new Error('unexpected end of input');
    if (text[i] === '(') {
      i++;
      const list = [];
      for (;;) {
        while (i < n && isSpace(i)) i++;
        if (i >= n) throw new Error('unbalanced parentheses');
        if (text[i] === ')') { i++; return list; }
        list.push(node());
      }
    }
    if (text[i] === ')') throw new Error('unexpected close parenthesis');
    let j = i;
    while (j < n && !isDelim(j)) j++;
    const tok = text.slice(i, j);
    i = j;
    const c0 = tok.charCodeAt(0);
    const alpha = (c0 >= 65 && c0 <= 90) || (c0 >= 97 && c0 <= 122) || c0 === 95;
    if (!alpha) { const num = Number(tok); if (Number.isFinite(num)) return num; }
    return tok;
  }
  return node();
}

function synopsisColumns(tree) {
  if (!Array.isArray(tree) || tree[0] !== 'Table') return null;
  const columns = [];
  for (let c = 1; c < tree.length; c++) {
    const col = tree[c];
    if (!Array.isArray(col) || typeof col[0] !== 'string') return null;
    const name = col[0];
    const dots = [], runs = [], bands = [];
    let x = 0, sawRun = false;
    for (let k = 1; k < col.length; k++) {
      const cell = col[k];
      if (typeof cell === 'number') { dots.push({ col: name, x, v: cell }); x += 1; }
      else if (cell === 'NULL') { x += 1; }
      else if (Array.isArray(cell) && cell[0] === 'RunOfLengthWithProperties') {
        sawRun = true;
        const len = cell[1];
        const p = {};
        for (let q = 2; q < cell.length; q++)
          if (Array.isArray(cell[q]) && typeof cell[q][0] === 'string') p[cell[q][0]] = cell[q][1];
        const first = p.First || 0, slope = p.Slope || 0, res = p.MaxResidual || 0;
        const x0 = x, x1 = x + len, end = first + slope * len;
        runs.push({ col: name, x1: x0, y1: first, x2: x1, y2: end });
        const z = name + '#' + k;
        bands.push({ col: name, z, x: x0, lo: first - res, hi: first + res });
        bands.push({ col: name, z, x: x1, lo: end - res, hi: end + res });
        x = x1;
      } else return null;
    }
    columns.push({ name, dots, runs, bands, sawRun });
  }
  if (!columns.some((c) => c.sawRun)) return null;
  return columns;
}

function columnNameSpans(text) {
  const n = text.length;
  let i = 0;
  const isSpace = (k) => { const c = text.charCodeAt(k); return c === 32 || (c >= 9 && c <= 13); };
  const skip = () => { while (i < n && isSpace(i)) i++; };
  const token = () => { const s = i; while (i < n && !isSpace(i) && text[i] !== '(' && text[i] !== ')') i++; return [s, i]; };
  skip();
  if (text[i] !== '(') return [];
  i++; skip();
  const head = token();
  if (text.slice(head[0], head[1]) !== 'Table') return [];
  const spans = [];
  for (;;) {
    skip();
    if (i >= n) break;
    if (text[i] === ')') { i++; break; }
    if (text[i] === '(') {
      i++; skip();
      const name = token();
      spans.push({ name: text.slice(name[0], name[1]), from: name[0], to: name[1] });
      let depth = 1;
      while (i < n && depth > 0) { const c = text[i++]; if (c === '(') depth++; else if (c === ')') depth--; }
    } else { token(); }
  }
  return spans;
}

function renderSynopsis(columns, host, opts = {}) {
  const dots = columns.flatMap((c) => c.dots);
  const runs = columns.flatMap((c) => c.runs);
  const bands = columns.flatMap((c) => c.bands);
  const multi = columns.length > 1;
  const values = dots.map((d) => d.v).concat(bands.map((b) => b.hi)).concat(bands.map((b) => b.lo));
  const yMax = Math.max(1, ...values);
  const fy = multi ? { fy: 'col' } : {};
  const plot = Plot.plot({
    width: opts.width || Math.max(360, host.clientWidth || 900),
    height: opts.height || (multi ? 160 * columns.length + 40 : 420),
    marginLeft: 44,
    marginBottom: 34,
    x: { label: 'sample', grid: true, nice: true },
    y: { label: columns.length === 1 ? columns[0].name : 'value', domain: [0, yMax * 1.02], grid: true },
    ...(multi ? { fy: { label: null } } : {}),
    marks: [
      Plot.areaY(bands, { x: 'x', y1: 'lo', y2: 'hi', z: 'z', fill: '#4a80bf', fillOpacity: 0.3, ...fy }),
      Plot.link(runs, { x1: 'x1', y1: 'y1', x2: 'x2', y2: 'y2', stroke: '#1a4d8f', strokeWidth: 5, strokeLinecap: 'round', ...fy }),
      Plot.dot(dots, { x: 'x', y: 'v', fill: '#737373', r: 1.6, ...fy }),
    ],
  });
  host.replaceChildren(plot);
}

const WS_URL = (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host + "/ws";

// A plain FIFO queue suffices: the server answers one frame per query, in receipt order.
let socket = null;
const pendingReplies = [];

function bttMenu(show) {
  if (typeof trigger_action !== "function") return;
  try {
    trigger_action({
      json: JSON.stringify({
        BTTPredefinedActionType: show ? 386 : 387,
        BTTAdditionalActionData: '{"BTTMenuActionMenuID":"BOSS", "BTTMenuActionActivateKeyboardFocus": 2}',
      }),
      wait_for_reply: true,
    });
  } catch (e) {
    /* best-effort; swallow BTT bridge failures */
  }
}

function notifyNewQuery(text) {
  if (text.startsWith(";; error:")) return;
  bttMenu(true);
}

function openSocket() {
  socket = new WebSocket(WS_URL);
  socket.addEventListener("message", (e) => {
    const waiter = pendingReplies.shift();
    if (waiter) waiter.resolve(e.data);
    notifyNewQuery(e.data);
  });
  const fail = (reason) => {
    while (pendingReplies.length) pendingReplies.shift().reject(reason);
    socket = null;
  };
  socket.addEventListener("close", () => fail(new Error("connection closed")));
  socket.addEventListener("error", () => fail(new Error("connection error")));
  return socket;
}

function socketReady() {
  if (!socket || socket.readyState === WebSocket.CLOSING || socket.readyState === WebSocket.CLOSED)
    openSocket();
  if (socket.readyState === WebSocket.OPEN) return Promise.resolve();
  return new Promise((resolve, reject) => {
    // abort() detaches the losing listener so it can't linger on the socket.
    const cleanup = new AbortController();
    const finish = (done, value) => { cleanup.abort(); done(value); };
    socket.addEventListener("open", () => finish(resolve), { signal: cleanup.signal });
    socket.addEventListener("error", () => finish(reject, new Error("connection error")),
                            { signal: cleanup.signal });
  });
}

// The reply is the query JSON-encoded as a string, sometimes with trailing whitespace
// (mirrors McPike's tryUnwrapJSONString) — so parse rather than strip quotes by hand.
function unwrapQuery(text) {
  try {
    const parsed = JSON.parse(text);
    if (typeof parsed === "string") return parsed.replace(/\s+$/, "");
  } catch (e) {
    /* not a JSON string (e.g. an error frame) — show the frame as-is */
  }
  return text;
}

// One report command in flight at a time: dropping re-entrant calls keeps each
// approve/reject bound to the query currently previewed, so a double-fire can't
// admit a parallel-submitted query the operator never reviewed.
let reportInFlight = false;

async function loadCode(action = "refresh") {
  if (reportInFlight) return;
  reportInFlight = true;
  setDoc(queryView, ";; loading\u2026");
  try {
    await socketReady();
    const reply = await new Promise((resolve, reject) => {
      pendingReplies.push({ resolve, reject });
      socket.send(`(EvaluateInEngines (List (Monitoring report)) ${action})`);
    });
    setDoc(queryView, unwrapQuery(reply));
    applyAutoFold(queryView);
  } catch (e) {
    setDoc(queryView, ";; failed to load via WebSocket\n;; " + e);
  } finally {
    reportInFlight = false;
  }
}


const rejectOverlay = document.getElementById("reject-overlay");
const rejectDialog = document.getElementById("reject-dialog");
const rejectReason = document.getElementById("reject-reason");
const rejectCancel = document.getElementById("reject-cancel");

// Resolves to the reason string ("" if confirmed with none), or null if dismissed.
function askRejectReason() {
  return new Promise((resolve) => {
    const cleanup = new AbortController();
    const close = (result) => { cleanup.abort(); rejectOverlay.hidden = true; resolve(result); };
    rejectDialog.addEventListener("submit", (e) => { e.preventDefault(); close(rejectReason.value.trim()); }, { signal: cleanup.signal });
    rejectCancel.addEventListener("click", () => close(null), { signal: cleanup.signal });
    rejectOverlay.addEventListener("click", (e) => { if (e.target === rejectOverlay) close(null); }, { signal: cleanup.signal });
    rejectOverlay.addEventListener("keydown", (e) => {
      // Don't let these reach the global handler: close() flips hidden mid-event,
      // which would otherwise re-fire reject/approve and reopen the overlay.
      if (e.key === "Escape") { e.stopPropagation(); close(null); }
      else if (e.key === "Enter" && e.altKey) { e.preventDefault(); e.stopPropagation(); rejectDialog.requestSubmit(); }
    }, { signal: cleanup.signal });
    rejectReason.value = "";
    rejectOverlay.hidden = false;
    rejectReason.focus();
  });
}

document.getElementById("refresh").addEventListener("click", () => loadCode("refresh"));
document.getElementById("approve").addEventListener("click", () => {
  bttMenu(false);
  if (!boss) return;
  const wrapped = boss.wrap(queryView.state.doc.toString(), "Approve");
  if (wrapped.isError) { console.warn("approve wrap failed:", wrapped.text); return; }
  loadCode(wrapped.text.replace(/\s+$/, ""));
});

document.getElementById("reject").addEventListener("click", async () => {
  const reason = await askRejectReason();
  if (reason === null) return; // dismissed without rejecting
  bttMenu(false);
  loadCode(reason ? `(RejectedByUserWithReason ${JSON.stringify(reason)})` : "reject");
});

window.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !rejectOverlay.hidden) return;
  if (e.ctrlKey) { e.preventDefault(); document.getElementById("approve").click(); }
  else if (e.altKey) { e.preventDefault(); document.getElementById("reject").click(); }
});

loadCode();
</script>
